<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.name }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="shortcut icon" type="image/x-icon" href="{{ '/img/favicon.ico' | prepend: site.baseurl }}">
  <link href="{{ '/feed.xml' | prepend: site.baseurl }}" rel="alternate" type="application/atom+xml">
  <style>
    :root {
      --bg:      #1e2228;
      --surface: #262b33;
      --text:    #e5e7eb;
      --muted:   #9aa3b0;
      --faint:   #6b7280;
      --accent:  #7dd3fc;
      --border:  #313844;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 14vh 24px 18vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Site header / brand */
    .brand { margin: 0 0 7vh; }
    .brand .avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
    }
    .brand .avatar--placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2b313b, #3a424f);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .brand .name {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: .3px;
    }
    .brand .name a { color: var(--text); }
    .brand .name a:hover { color: var(--accent); text-decoration: none; }
    .brand .tagline {
      margin: .5rem 0 0;
      font-size: 14px;
      font-style: italic;
      color: var(--muted);
    }

    /* About section */
    .about { margin: 0 0 4rem; }
    .about h2 {
      margin: 0 0 .7rem;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--faint);
    }
    .about p { margin: 0 0 .65rem; color: #d6dae1; font-size: 15.5px; line-height: 1.5; }
    .about a { text-decoration: underline; }
    .col-intro .links {
      margin: 1.1rem 0 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .col-intro .links a {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: var(--text);
      text-decoration: none;
      padding: 6px 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: color .15s ease, background .15s ease, border-color .15s ease, transform .15s ease;
    }
    .col-intro .links a svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
      flex: 0 0 auto;
    }
    .col-intro .links a:hover {
      color: var(--bg);
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    /* Home: blog left, intro right */
    .wrap.home { max-width: 1140px; }
    .home-grid { display: flex; flex-direction: column; gap: 3rem; }
    .home-grid .col-intro { order: 1; }
    .home-grid .col-posts { order: 2; }
    .col-intro .brand { margin-bottom: 1.5rem; }
    .col-intro .about { margin-bottom: 0; }
    @media (min-width: 820px) {
      .home-grid { flex-direction: row; gap: 4.5rem; align-items: flex-start; }
      .home-grid .col-posts { order: 1; flex: 1 1 auto; min-width: 0; }
      .home-grid .col-intro {
        order: 2;
        flex: 0 0 460px;
        position: sticky;
        top: 16px;
        align-self: start;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        scrollbar-width: none;
      }
      .home-grid .col-intro::-webkit-scrollbar { width: 0; height: 0; }
    }

    /* Year jump navigation (sticky + scroll-spy) */
    .year-nav {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 2.4rem;
      padding: 14px 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .year-nav a {
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--faint);
      text-decoration: none;
      padding: 4px 11px;
      border-radius: 999px;
      transition: color .15s ease, background .15s ease;
    }
    .year-nav a:hover { color: var(--text); background: var(--surface); }
    .year-nav a.active { color: var(--bg); background: var(--accent); }

    /* Year-grouped index */
    .year { margin: 0 0 3.4rem; scroll-margin-top: 72px; }
    .year > h2 {
      margin: 0 0 1rem;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--faint);
    }
    .posts { list-style: none; margin: 0; padding: 0; }
    .posts li {
      display: flex;
      gap: 16px;
      align-items: baseline;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }
    .posts li:last-child { border-bottom: none; }
    .posts .date {
      flex: 0 0 38px;
      font-size: 13px;
      color: var(--faint);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .posts a {
      color: var(--text);
      flex: 1;
    }
    .posts a:hover { color: var(--accent); text-decoration: none; }
    .posts .src {
      flex: 0 0 auto;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--faint);
      white-space: nowrap;
    }
    .posts .star { color: #f5c451; font-size: 12px; }

    /* Post page */
    .post h1 { font-size: 28px; line-height: 1.3; margin: 0 0 .4rem; }
    .post .meta { color: var(--faint); font-size: 14px; margin-bottom: 2.4rem; }
    .post .content { color: #d6dae1; }
    .post .content h2 { font-size: 22px; margin-top: 2.4rem; }
    .post .content h3 { font-size: 18px; margin-top: 2rem; }
    .post .content img { max-width: 100%; height: auto; border-radius: 6px; }
    .post .content a { text-decoration: underline; }
    .post .content blockquote {
      margin: 1.4rem 0;
      padding: .2rem 1.2rem;
      border-left: 3px solid var(--accent);
      color: var(--muted);
    }
    code {
      font-family: "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: .88em;
      background: var(--surface);
      padding: .15em .4em;
      border-radius: 4px;
    }
    pre {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      line-height: 1.5;
    }
    pre code { background: none; padding: 0; }
    .content figure.highlight { margin: 1.4rem 0; }
    .content figure.highlight pre { margin: 0; }
    .content .highlight { background: none; }
    .back {
      display: inline-block;
      margin-bottom: 3rem;
      font-size: 14px;
      color: var(--muted);
    }
    hr { border: none; border-top: 1px solid var(--border); margin: 3rem 0; }
  </style>
</head>
<body>
  <main class="wrap{% if page.home %} home{% endif %}">
    {% unless page.home %}
    <header class="brand">
      <p class="name"><a href="{{ '/' | prepend: site.baseurl }}">{{ site.name }}</a></p>
      <p class="tagline">{{ site.tagline }}</p>
    </header>
    {% endunless %}
    {{ content }}
  </main>
  <script>
    // Highlight the year in the nav as its posts scroll into view
    (function () {
      var links = document.querySelectorAll('.year-nav a');
      if (!links.length || !('IntersectionObserver' in window)) return;
      var map = {};
      links.forEach(function (a) { map[a.getAttribute('href').slice(1)] = a; });
      var setActive = function (id) {
        links.forEach(function (a) { a.classList.remove('active'); });
        if (map[id]) map[id].classList.add('active');
      };
      var obs = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) setActive(e.target.id);
        });
      }, { rootMargin: '-15% 0px -75% 0px' });
      document.querySelectorAll('.year').forEach(function (s) { obs.observe(s); });
    })();
  </script>
</body>
</html>
